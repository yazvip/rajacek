openapi: 3.1.0
info:
  title: Rajacek Validation API
  version: 0.1.0
  summary: API validasi rekening, e-wallet, WhatsApp, dan PLN dengan kontrol quota, rate limit, dan idempotensi.
  description: |
    Rajacek menerima permintaan validasi melalui API key yang memiliki scope produk sesuai.
    Satu endpoint `GET /api/v3/validate` (kunci lewat query `api_key`) dan `POST /api/v3/validate` (kunci lewat header atau field body `api_key`) melayani semua produk lewat `code`: kode bank 3 digit, slug e-wallet, `pln`, atau `whatsapp`.
    Endpoint POST menerima `Idempotency-Key` unik dari klien; bila tidak dikirim atau kosong, server membuatkannya otomatis dan mengembalikannya lewat header respons `Idempotency-Key` (retry tanpa kunci sendiri dianggap operasi baru). GET tidak idempotent: setiap GET adalah cek baru.

    Nilai rekening, nomor e-wallet, dan nomor telepon harus diperlakukan sebagai data sensitif.
    Jangan menulis nilai tersebut ke log aplikasi klien atau membagikannya tanpa dasar hukum/izin yang sesuai.
servers:
  - url: https://www.rajacek.com
    description: Produksi
security:
  - ApiKeyAuth: []
tags:
  - name: Validation
    description: Endpoint validasi untuk integrasi member.
  - name: System
    description: Endpoint pemeriksaan layanan.
paths:
  /health/live:
    get:
      tags: [System]
      security: []
      operationId: getLiveness
      summary: Pemeriksaan proses hidup
      responses:
        '200':
          description: Proses API hidup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /status:
    get:
      tags: [System]
      security: []
      operationId: getPublicStatusPage
      summary: Halaman status layanan publik (HTML)
      description: |
        Halaman status tanpa login. Hanya menampilkan label produk
        (Validasi Rekening, Validasi E-Wallet, Validasi WhatsApp) dan
        status agregat operational/degraded, plus banner pengumuman
        atau maintenance yang sedang aktif. Tidak pernah menyebut
        nama, URL, atau kode provider upstream.
      responses:
        '200':
          description: Halaman status layanan.
          content:
            text/html:
              schema: { type: string }
  /v1/status:
    get:
      tags: [System]
      security: []
      operationId: getPublicStatus
      summary: Status layanan publik (JSON)
      description: Data yang sama dengan GET /status, dalam JSON, tanpa login.
      responses:
        '200':
          description: Status agregat layanan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStatus'
  /v1/banks:
    get:
      tags: [System]
      operationId: listBankCodes
      summary: Daftar code_bank tiga digit yang diterima Rajacek
      responses:
        '200':
          description: Katalog bank yang didukung Rajacek.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BankCode' }
  /api/v3/validate:
    get:
      tags: [Validation]
      operationId: validateV3Get
      summary: Memvalidasi lewat query string
      description: |
        Satu endpoint untuk semua produk. `code` memilih produk: kode bank 3 digit (mis. `002` BRI), slug e-wallet (`dana`, `gopay`, `gopay_driver`, `ovo`, `shopeepay`, `linkaja`, `astrapay`, `isaku`, `kaspro`), `pln`, atau `whatsapp`; nomornya di `accountNumber`.
        GET tidak idempotent: setiap GET adalah cek baru. Kunci lewat query `api_key` atau header (`X-API-Key` / `Authorization: Bearer`); bila sumber berbeda nilainya, request ditolak 401.
        API key memerlukan scope produk yang sesuai atau `validate:*`.
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          description: Kode produk (lihat deskripsi).
        - name: accountNumber
          in: query
          required: true
          schema:
            type: string
          description: Nomor rekening / akun e-wallet / ID pelanggan PLN / nomor WhatsApp.
        - name: api_key
          in: query
          required: false
          schema:
            type: string
          description: Kunci API member (boleh juga lewat header).
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          $ref: '#/components/responses/ValidationSuccess'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExhausted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/ProviderError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    post:
      tags: [Validation]
      operationId: validateV3Post
      summary: Memvalidasi lewat body JSON (mendukung idempotensi)
      description: |
        Sama seperti GET, tetapi kunci lewat header atau field body `api_key`, dan mendukung `Idempotency-Key` (8–200 karakter ASCII tanpa spasi). `code` harus berupa string — angka `2` bukan `"002"` dan ditolak 400.
        API key memerlukan scope produk yang sesuai atau `validate:*`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V3ValidateRequest'
            examples:
              bank:
                value:
                  code: '002'
                  accountNumber: '1234567890'
              ewallet:
                value:
                  code: gopay
                  accountNumber: '081234567890'
      responses:
        '200':
          $ref: '#/components/responses/ValidationSuccess'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '402': { $ref: '#/components/responses/QuotaExhausted' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502': { $ref: '#/components/responses/ProviderError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Kunci member (baru: prefix `rc_`; lama: `rv_live_` tetap berlaku); Authorization Bearer juga didukung.'
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Nilai unik 8-200 karakter ASCII per operasi bisnis. Gunakan nilai yang sama saat retry request yang sama. Opsional — bila kosong, server membuatkan kunci unik otomatis dan mengembalikannya di header respons Idempotency-Key.
      schema:
        type: string
        minLength: 8
        maxLength: 200
        pattern: '^[!-~]+$'
      example: pay-ord-20261020-8a3c2f11
    RequestId:
      name: X-Request-ID
      in: header
      required: false
      description: Korelasi opsional dari klien; server selalu mengembalikan nilai request ID.
      schema:
        type: string
        maxLength: 128
  responses:
    ValidationSuccess:
      description: Validasi selesai diproses. Periksa field `status`, karena hasil `not_found` atau `pending` tetap dapat berupa respons teknis 200.
      headers:
        X-Request-ID:
          schema: { type: string }
        X-RateLimit-Remaining:
          schema: { type: integer }
        X-RateLimit-Reset:
          schema: { type: integer, description: Detik sampai jendela limit berikutnya. }
        X-Idempotent-Replay:
          schema: { type: string, enum: ['true'] }
          description: Ada hanya jika respons berasal dari cache idempotensi.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationResponse' }
    BadRequest:
      description: Permintaan tidak memenuhi kontrak.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Unauthorized:
      description: API key tidak valid, tidak dikirim, atau sudah tidak aktif.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Forbidden:
      description: Akses tidak memiliki scope atau peran yang diperlukan.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Conflict:
      description: Idempotency-Key atau data unik bertabrakan.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    QuotaExhausted:
      description: Kuota paket atau saldo hit sudah habis.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    RateLimited:
      description: Permintaan ditolak oleh limiter.
      headers:
        Retry-After:
          schema: { type: integer }
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    ProviderError:
      description: Provider validasi gagal merespons dengan aman.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    ServiceUnavailable:
      description: Dependensi penting tidak tersedia.
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
  schemas:
    HealthResponse:
      type: object
      required: [status, service, timestamp, provider_mode]
      properties:
        status: { type: string, example: ready }
        service: { type: string, example: rajacek-api }
        timestamp: { type: string, format: date-time }
        provider_mode: { type: string, enum: [demo, http] }
    PublicProductStatus:
      type: object
      required: [product, label, status]
      properties:
        product: { type: string, enum: [bank_account, ewallet, whatsapp, pln] }
        label: { type: string, example: Validasi Rekening }
        status: { type: string, enum: [operational, degraded] }
    PublicStatus:
      type: object
      required: [overall, products, maintenance_blocks_validations]
      properties:
        overall: { type: string, enum: [operational, degraded] }
        products:
          type: array
          items: { $ref: '#/components/schemas/PublicProductStatus' }
        announcement: { type: string, nullable: true }
        maintenance_banner: { type: string, nullable: true }
        maintenance_blocks_validations: { type: boolean }
    BankCode:
      type: object
      required: [code_bank, name_bank]
      properties:
        code_bank: { type: string, pattern: '^[0-9]{3}$', example: '002' }
        name_bank: { type: string, example: BRI }
    V3ValidateRequest:
      type: object
      additionalProperties: false
      required: [code, accountNumber]
      properties:
        code:
          type: string
          description: Kode produk — kode bank 3 digit (mis. `002` BRI), slug e-wallet, `pln`, atau `whatsapp`. Harus string.
          example: '002'
        accountNumber:
          type: string
          description: Nomor rekening / akun e-wallet / ID pelanggan PLN / nomor WhatsApp.
          example: '1234567890'
        api_key:
          type: string
          description: Kunci API member (opsional bila sudah dikirim lewat header).
    ValidationResponse:
      type: object
      required: [request_id, status, valid, product, message, meta]
      properties:
        request_id: { type: string, format: uuid }
        status:
          type: string
          description: 'Billing: valid dan not_kyc memotong 1 hit; invalid dan not_found (satu pool bersama) gratis hingga 100 per hari per kunci (WIB), selebihnya 1 hit; pending, provider_error, rate_limited, dan quota_exhausted tidak memotong dan tidak memakan jatah gratis. Kunci bersaldo 0 tetap ditolak 402 sebelum cek berjalan.'
          enum: [valid, invalid, not_found, not_kyc, pending, provider_error, rate_limited, quota_exhausted]
        valid: { type: boolean }
        product: { $ref: '#/components/schemas/ValidationProduct' }
        message: { type: string }
        result: { $ref: '#/components/schemas/ValidationResultData' }
        meta: { $ref: '#/components/schemas/ValidationMeta' }
    ValidationResultData:
      type: object
      properties:
        account_number: { type: [string, 'null'], description: Nomor rekening/e-wallet yang divalidasi (bank & e-wallet). }
        phone_number: { type: [string, 'null'], description: Nomor WhatsApp yang divalidasi (layanan whatsapp). }
        service_code: { type: [string, 'null'], description: Kode layanan yang divalidasi (kode bank 3 digit, slug e-wallet, atau whatsapp). }
        bank_name: { type: [string, 'null'], description: Nama bank sesuai katalog (khusus layanan bank). }
        account_name: { type: [string, 'null'], description: Nilai dapat dimasking oleh provider. Selalu huruf besar semua. }
        tarif: { type: [string, 'null'], description: Tarif listrik pelanggan (khusus produk pln, hanya bila tersedia). }
        daya: { type: [string, 'null'], description: Daya tersambung pelanggan dalam VA (khusus produk pln, hanya bila tersedia). }
        registered: { type: [boolean, 'null'] }
        reference: { type: [string, 'null'] }
    ValidationMeta:
      type: object
      required: [provider, provider_latency_ms, rajacek_processing_ms, total_latency_ms, cached, remaining_quota]
      properties:
        provider: { type: string }
        provider_latency_ms: { type: integer, minimum: 0, description: Waktu panggilan provider dalam milidetik. }
        rajacek_processing_ms: { type: integer, minimum: 0, description: Waktu proses Rajacek di luar panggilan provider. }
        total_latency_ms: { type: integer, minimum: 0, description: Total waktu request yang terukur oleh Rajacek. }
        cached: { type: boolean }
        remaining_quota: { type: integer, minimum: 0 }
        expires_at: { type: [string, 'null'], format: date-time, description: Masa aktif paket yang sedang dipakai (kedaluwarsa paket yang paling cepat habis), sama dengan yang tampil di portal member. null berarti kunci tidak pernah kedaluwarsa. Bukan tanggal kunci mati: kunci tetap bisa dipakai selama masih ada paket aktif, dan tanggal ini bergeser otomatis saat paket yang sedang dipakai habis atau lewat masa aktifnya. }
    ValidationProduct:
      type: string
      enum: [bank_account, ewallet, whatsapp, pln]
    ApiError:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
          examples: [bad_request, unauthorized, rate_limited, quota_exhausted, provider_error]
        message: { type: string }
        request_id: { type: string }
        details: {}