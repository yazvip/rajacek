# =============================================================================
# rajacek.com — nginx site config, diterapkan 2026-10-27 (deploy gabungan loginfix)
# Perbaikan: audit login 2026-10-27, temuan BESAR-1 (identitas IP) + KECIL-8 (:80)
#
# STATUS: file ini SAMA PERSIS dengan /etc/nginx/sites-available/rajacek.com
# yang sedang jalan (termasuk koreksi location / — lihat README-20261027.md
# §8: return tingkat server terbukti mengalahkan lokasi ACME).
#
# Sumber daftar CIDR Cloudflare: https://www.cloudflare.com/ips-v4 dan
# https://www.cloudflare.com/ips-v6, diambil 2026-10-27 (WIB). Daftar di bawah
# adalah salinan verbatim hasil fetch tersebut — bukan dari memori.
# =============================================================================

server {
    server_name rajacek.com www.rajacek.com;

    client_max_body_size 1m;

    # --- BESAR-1: identitas IP klien yang tidak bisa dipalsukan -------------
    # real_ip hanya memercayai header CF-Connecting-IP dari peer yang IP-nya
    # ada di daftar set_real_ip_from (rentang resmi Cloudflare di bawah).
    # Setelah ini, $remote_addr = IP klien asli (via Cloudflare) atau IP peer
    # langsung (bila request tidak lewat Cloudflare — mis. langsung ke origin).
    # Header kiriman klien dari peer di luar daftar ini DIABAIKAN, sehingga
    # spoof CF-Connecting-IP / X-Forwarded-For tidak lagi berpengaruh.
    # real_ip_recursive on: bila header berisi rantai, terus telusuri sampai
    # menemukan IP pertama yang bukan trusted proxy.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # OVERWRITE, bukan append: nilai kiriman klien dibuang. Setelah
        # real_ip di atas, $remote_addr adalah IP klien asli (via CF) atau
        # IP peer langsung — jadi header yang sampai ke aplikasi tidak bisa
        # lagi dipalsukan. (Sebelumnya: $proxy_add_x_forwarded_for.)
        proxy_set_header X-Forwarded-For $remote_addr;
        # OVERWRITE dengan nilai yang sama: aplikasi (effective_client_ip)
        # membaca CF-Connecting-IP pertama, dan nilai ini kini dijamin
        # berasal dari nginx, bukan dari klien.
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/rajacek.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/rajacek.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name rajacek.com www.rajacek.com;

    # --- KECIL-8: :80 dialihkan ke HTTPS, kecuali tantangan ACME ------------
    # Pengecualian ini adalah jaring pengaman, BUKAN jalur renewal live.
    # Jalur renewal live adalah certbot plugin nginx (authenticator = nginx
    # di /etc/letsencrypt/renewal/rajacek.com.conf): certbot menyisipkan
    # lokasi exact-match per token selama renewal lalu menghapusnya lagi.
    # Lokasi exact-match tersebut mengalahkan prefix ^~ di bawah, jadi
    # keduanya bisa berdampingan. Bila pengecualian ini ternyata mengganggu
    # renewal, hapus blok location ini saja (301 murni tetap kompatibel
    # dengan plugin nginx karena lokasi sisipan certbot menang untuk URL
    # tantangan) — dan uji dengan `certbot renew --dry-run`.
    # Webroot fallback: /var/www/html (direktori ini ada di server; subdir
    # .well-known/ saat ini belum ada — tidak dibutuhkan jalur plugin nginx).
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        root /var/www/html;
        try_files $uri =404;
    }

    # PENTING (gotcha nginx, terbukti live 2026-10-27): `return` di tingkat
    # server dieksekusi pada fase server-rewrite — SEBELUM location matching
    # — sehingga lokasi ACME di atas tidak pernah tercapai bila return ada
    # di tingkat server (gejala yang teramati: semua path ACME ikut 301,
    # dan debug log tidak menunjukkan baris "test location" sama sekali).
    # Karena itu return HARUS tinggal di dalam `location /`: lokasi ^~ ACME
    # (prefix terpanjang) menang atas `/` untuk path tantangan, sisanya
    # jatuh ke `location /` di bawah.
    location / {
        return 301 https://$host$request_uri;
    }
}
